name: GoreeCloud Gallery acceptance validation

on:
  push:
    branches: [main]
    paths:
      - 'patches/**'
      - 'scripts/**'
      - '.github/**'
      - 'README.md'
      - 'CHANGELOG.md'
      - 'LICENSE'
      - 'SECURITY.md'
      - 'CONTRIBUTING.md'
      - 'NOTICE.md'
      - 'docs/**'
  pull_request:
    branches: [main]
    paths:
      - 'patches/**'
      - 'scripts/**'
      - '.github/**'
      - 'README.md'
      - 'CHANGELOG.md'
      - 'LICENSE'
      - 'SECURITY.md'
      - 'CONTRIBUTING.md'
      - 'NOTICE.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: goreecloud-gallery-acceptance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Check out GoreeCloud Gallery exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify exact repository revision
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          printf 'Validated repository revision: %s\n' "$EXPECTED_SHA"

      - name: Validate repository structure
        run: bash scripts/validate-repository-structure.sh

      - name: Validate repository security guardrails
        run: bash scripts/validate-repository-security.sh

      - name: Set up Java 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'

      - name: Reconstruct exact GoreeCloud source
        run: bash scripts/reconstruct-source.sh

      - name: Validate GoreeCloud source acceptance invariants
        run: bash scripts/validate-source-invariants.sh

      - name: Run GoreeCloud behavioral tests and Android lint
        shell: bash
        working-directory: upstream-gallery
        run: |
          set -euo pipefail
          mkdir -p ../dist/validation
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace :app:testFossDebugUnitTest :app:lintFossDebug 2>&1 \
            | tee ../dist/validation/gradle-test-lint.log

          if grep -Fq '> Task :app:testFossDebugUnitTest NO-SOURCE' ../dist/validation/gradle-test-lint.log; then
            printf '%s\n' 'GoreeCloud behavioral-test task unexpectedly reported NO-SOURCE.' >&2
            exit 1
          fi

          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          result_dir = Path('app/build/test-results/testFossDebugUnitTest')
          xml_files = sorted(result_dir.glob('TEST-*.xml'))
          if not xml_files:
              raise SystemExit('No JUnit XML results were produced for testFossDebugUnitTest')

          tests = failures = errors = skipped = 0
          target_class = 'org.fossify.gallery.helpers.GoreeCloudGalleryPolicyTest'
          target_seen = False
          for path in xml_files:
              root = ET.parse(path).getroot()
              tests += int(root.attrib.get('tests', '0'))
              failures += int(root.attrib.get('failures', '0'))
              errors += int(root.attrib.get('errors', '0'))
              skipped += int(root.attrib.get('skipped', '0'))
              for case in root.iter('testcase'):
                  if case.attrib.get('classname') == target_class:
                      target_seen = True

          if not target_seen:
              raise SystemExit(f'Required GoreeCloud test class did not execute: {target_class}')
          if tests < 3:
              raise SystemExit(f'Expected at least 3 behavioral tests, observed {tests}')
          if failures or errors:
              raise SystemExit(f'Behavioral tests are not green: failures={failures}, errors={errors}')

          evidence = Path('../dist/validation/unit-test-coverage.txt')
          evidence.write_text(
              '\n'.join([
                  'task=:app:testFossDebugUnitTest',
                  'task_status=success',
                  'no_source=false',
                  'meaningful_behavioral_unit_tests_executed=true',
                  f'required_test_class={target_class}',
                  f'tests={tests}',
                  f'failures={failures}',
                  f'errors={errors}',
                  f'skipped={skipped}',
                  'interpretation=JUnit XML proves GoreeCloud-owned behavioral tests executed successfully.',
                  '',
              ]),
              encoding='utf-8',
          )
          PY

      - name: Build installable FOSS acceptance APK
        working-directory: upstream-gallery
        run: ./gradlew --no-daemon --stacktrace :app:assembleFossDebug

      - name: Collect and validate acceptance evidence
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p dist/validation
          mapfile -t apks < <(find upstream-gallery/app/build/outputs/apk/foss/debug -type f -name '*.apk' | sort)
          test "${#apks[@]}" -eq 1

          APK="dist/GoreeCloud-Gallery-1.0.0.apk"
          cp "${apks[0]}" "$APK"

          CHECKSUM_OUTPUT="dist/GoreeCloud-Gallery-1.0.0.sha256" \
          EXPECTED_DEBUGGABLE=true \
            bash scripts/validate-apk.sh "$APK" 1.0.0 2>&1 \
            | tee dist/validation/apk-validation.txt

          bash scripts/write-build-evidence.sh \
            "$APK" \
            1.0.0 \
            acceptance-candidate \
            dist/validation/build-evidence.txt

          cp upstream-gallery/GOREECLOUD-NOTICE.md dist/GOREECLOUD-NOTICE.md
          cp upstream-gallery/LICENSE dist/LICENSE-GPL-3.0.txt

          if [ -d upstream-gallery/app/build/reports ]; then
            find upstream-gallery/app/build/reports -maxdepth 1 -type f -name 'lint-results-fossDebug.*' \
              -exec cp {} dist/validation/ \;
          fi

          if [ -d upstream-gallery/app/build/reports/tests ]; then
            cp -R upstream-gallery/app/build/reports/tests dist/validation/test-reports
          fi

          if [ -d upstream-gallery/app/build/test-results ]; then
            cp -R upstream-gallery/app/build/test-results dist/validation/test-results
          fi

          if [ -f upstream-gallery/build/reports/problems/problems-report.html ]; then
            cp upstream-gallery/build/reports/problems/problems-report.html dist/validation/gradle-problems-report.html
          fi

      - name: Upload acceptance artifact and validation evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: GoreeCloud-Gallery-1.0.0-acceptance-candidate
          path: dist/
          if-no-files-found: error
          retention-days: 30
