name: Native Android App

on:
  pull_request:
    paths:
      - "native/**"
      - ".github/workflows/native-android-app.yml"
  push:
    branches: [main]
    paths:
      - "native/**"
      - ".github/workflows/native-android-app.yml"

permissions:
  contents: read

jobs:
  app:
    runs-on: ubuntu-latest
    env:
      SOURCE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
    defaults:
      run:
        working-directory: native
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_REVISION }}
          persist-credentials: false
      - name: Verify exact source revision
        run: test "$(git rev-parse HEAD)" = "$SOURCE_REVISION"
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          gradle-version: "8.14.3"
      - name: Test native core, adapter, and app contract
        run: gradle :core:test :android-adapter:testDebugUnitTest :app:testDebugUnitTest --no-daemon
      - name: Build native Gallery debug APK
        run: gradle :app:assembleDebug --no-daemon
      - name: Upload native Gallery debug APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: goreecloud-gallery-debug-${{ env.SOURCE_REVISION }}
          path: native/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
