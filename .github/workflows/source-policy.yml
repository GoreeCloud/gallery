name: Source policy checks
on:
  pull_request:
  push:
    branches: [main, "ftn/**"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ftn-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify source defaults and provenance
        run: python3 scripts/verify_ftn.py
