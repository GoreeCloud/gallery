name: Build signed GoreeCloud Gallery release candidate

on:
  workflow_dispatch:
    inputs:
      version:
        description: Expected GoreeCloud Gallery version name
        required: true
        default: '1.0.0'
        type: string

permissions:
  contents: read

concurrency:
  group: goreecloud-gallery-signed-release-candidate
  cancel-in-progress: false

jobs:
  signed-release-candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: stable-release

    steps:
      - name: Check out GoreeCloud Gallery exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify exact repository revision
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          printf 'Validated repository revision: %s\n' "$EXPECTED_SHA"

      - name: Validate repository structure
        run: bash scripts/validate-repository-structure.sh

      - name: Validate repository security guardrails
        run: bash scripts/validate-repository-security.sh

      - name: Set up Java 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'

      - name: Reconstruct exact GoreeCloud source
        run: bash scripts/reconstruct-source.sh

      - name: Validate GoreeCloud source acceptance invariants
        run: bash scripts/validate-source-invariants.sh

      - name: Run GoreeCloud release behavioral tests and Android lint
        shell: bash
        working-directory: upstream-gallery
        run: |
          set -euo pipefail
          mkdir -p ../dist/validation
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace :app:testFossReleaseUnitTest :app:lintFossRelease 2>&1 \
            | tee ../dist/validation/gradle-test-lint.log

          if grep -Fq '> Task :app:testFossReleaseUnitTest NO-SOURCE' ../dist/validation/gradle-test-lint.log; then
            printf '%s\n' 'GoreeCloud release behavioral-test task unexpectedly reported NO-SOURCE.' >&2
            exit 1
          fi

          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          result_dir = Path('app/build/test-results/testFossReleaseUnitTest')
          xml_files = sorted(result_dir.glob('TEST-*.xml'))
          if not xml_files:
              raise SystemExit('No JUnit XML results were produced for testFossReleaseUnitTest')

          tests = failures = errors = skipped = 0
          target_class = 'org.fossify.gallery.helpers.GoreeCloudGalleryPolicyTest'
          target_seen = False
          for path in xml_files:
              root = ET.parse(path).getroot()
              tests += int(root.attrib.get('tests', '0'))
              failures += int(root.attrib.get('failures', '0'))
              errors += int(root.attrib.get('errors', '0'))
              skipped += int(root.attrib.get('skipped', '0'))
              for case in root.iter('testcase'):
                  if case.attrib.get('classname') == target_class:
                      target_seen = True

          if not target_seen:
              raise SystemExit(f'Required GoreeCloud test class did not execute: {target_class}')
          if tests < 3:
              raise SystemExit(f'Expected at least 3 release behavioral tests, observed {tests}')
          if failures or errors:
              raise SystemExit(f'Release behavioral tests are not green: failures={failures}, errors={errors}')

          evidence = Path('../dist/validation/unit-test-coverage.txt')
          evidence.write_text(
              '\n'.join([
                  'task=:app:testFossReleaseUnitTest',
                  'task_status=success',
                  'no_source=false',
                  'meaningful_behavioral_unit_tests_executed=true',
                  f'required_test_class={target_class}',
                  f'tests={tests}',
                  f'failures={failures}',
                  f'errors={errors}',
                  f'skipped={skipped}',
                  'interpretation=JUnit XML proves GoreeCloud-owned release behavioral tests executed successfully.',
                  '',
              ]),
              encoding='utf-8',
          )
          PY

      - name: Build unsigned FOSS release APK
        working-directory: upstream-gallery
        run: ./gradlew --no-daemon --stacktrace :app:assembleFossRelease

      - name: Validate release-signing secret boundary
        shell: bash
        env:
          ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          ANDROID_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
          ANDROID_RELEASE_CERT_SHA256: ${{ secrets.ANDROID_RELEASE_CERT_SHA256 }}
        run: |
          set -euo pipefail
          : "${ANDROID_RELEASE_KEYSTORE_BASE64:?ANDROID_RELEASE_KEYSTORE_BASE64 is not configured}"
          : "${ANDROID_RELEASE_KEYSTORE_PASSWORD:?ANDROID_RELEASE_KEYSTORE_PASSWORD is not configured}"
          : "${ANDROID_RELEASE_KEY_ALIAS:?ANDROID_RELEASE_KEY_ALIAS is not configured}"
          : "${ANDROID_RELEASE_KEY_PASSWORD:?ANDROID_RELEASE_KEY_PASSWORD is not configured}"
          : "${ANDROID_RELEASE_CERT_SHA256:?ANDROID_RELEASE_CERT_SHA256 is not configured}"

      - name: Align, sign, and validate release candidate
        shell: bash
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
          ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          ANDROID_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
          ANDROID_RELEASE_CERT_SHA256: ${{ secrets.ANDROID_RELEASE_CERT_SHA256 }}
        run: |
          set -euo pipefail

          mkdir -p dist/validation
          mapfile -t apks < <(find upstream-gallery/app/build/outputs/apk/foss/release -type f -name '*.apk' | sort)
          test "${#apks[@]}" -eq 1

          ZIPALIGN="$(find "$ANDROID_HOME/build-tools" -type f -name zipalign | sort -V | tail -n 1)"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$ZIPALIGN"
          test -x "$APKSIGNER"

          KEYSTORE="$RUNNER_TEMP/goreecloud-gallery-release.jks"
          ALIGNED="$RUNNER_TEMP/GoreeCloud-Gallery-aligned.apk"
          SIGNED="dist/GoreeCloud-Gallery-${EXPECTED_VERSION}.apk"
          trap 'rm -f "$KEYSTORE" "$ALIGNED"' EXIT

          umask 077
          printf '%s' "$ANDROID_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
          test -s "$KEYSTORE"

          "$ZIPALIGN" -f -v 4 "${apks[0]}" "$ALIGNED"
          "$APKSIGNER" sign \
            --ks "$KEYSTORE" \
            --ks-key-alias "$ANDROID_RELEASE_KEY_ALIAS" \
            --ks-pass env:ANDROID_RELEASE_KEYSTORE_PASSWORD \
            --key-pass env:ANDROID_RELEASE_KEY_PASSWORD \
            --out "$SIGNED" \
            "$ALIGNED"

          CHECKSUM_OUTPUT="dist/GoreeCloud-Gallery-${EXPECTED_VERSION}.sha256" \
          EXPECTED_DEBUGGABLE=false \
          EXPECTED_CERT_SHA256="$ANDROID_RELEASE_CERT_SHA256" \
            bash scripts/validate-apk.sh "$SIGNED" "$EXPECTED_VERSION" 2>&1 \
            | tee dist/validation/apk-validation.txt

          bash scripts/write-build-evidence.sh \
            "$SIGNED" \
            "$EXPECTED_VERSION" \
            signed-release-candidate \
            dist/validation/build-evidence.txt

          cp upstream-gallery/GOREECLOUD-NOTICE.md dist/GOREECLOUD-NOTICE.md
          cp upstream-gallery/LICENSE dist/LICENSE-GPL-3.0.txt

          if [ -d upstream-gallery/app/build/reports ]; then
            find upstream-gallery/app/build/reports -maxdepth 1 -type f -name 'lint-results-fossRelease.*' \
              -exec cp {} dist/validation/ \;
          fi

          if [ -d upstream-gallery/app/build/reports/tests ]; then
            cp -R upstream-gallery/app/build/reports/tests dist/validation/test-reports
          fi

          if [ -d upstream-gallery/app/build/test-results ]; then
            cp -R upstream-gallery/app/build/test-results dist/validation/test-results
          fi

      - name: Upload signed release-candidate evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: GoreeCloud-Gallery-${{ inputs.version }}-signed-RC
          path: dist/
          if-no-files-found: error
          retention-days: 30
