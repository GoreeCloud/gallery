name: Native Android Adapter

on:
  pull_request:
    paths:
      - "native/**"
      - ".github/workflows/native-android-adapter.yml"
  push:
    branches: [main]
    paths:
      - "native/**"
      - ".github/workflows/native-android-adapter.yml"

permissions:
  contents: read

jobs:
  android-adapter:
    runs-on: ubuntu-latest
    env:
      SOURCE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
    defaults:
      run:
        working-directory: native
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_REVISION }}
          persist-credentials: false
      - name: Verify exact source revision
        run: test "$(git rev-parse HEAD)" = "$SOURCE_REVISION"
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
        with:
          gradle-version: "8.14.3"
      - name: Test native core and Android adapter
        run: gradle :core:test :android-adapter:testDebugUnitTest --no-daemon
      - name: Build Android adapter
        run: gradle :android-adapter:assembleDebug --no-daemon
