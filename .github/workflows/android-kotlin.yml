name: Android offline Kotlin compile
on:
  pull_request:
  push:
    branches: ["ftn/**"]
permissions:
  contents: read
jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"
      - run: sdkmanager --channel=3 --install "platforms;android-37.0" "ndk;29.0.14206865" "cmake;3.31.6"
      - run: ./gradlew :app:compileUniversalNoMLDebugKotlin --no-daemon --console plain
      - name: Stage isolated account URI regression source
        run: |
          mkdir -p app/src/accountUriTest/java/com/dot/gallery/cloud
          cp app/src/test/java/com/dot/gallery/cloud/CloudUriTest.kt app/src/accountUriTest/java/com/dot/gallery/cloud/CloudUriTest.kt
          cp app/src/test/java/com/dot/gallery/cloud/CloudTransferPolicyTest.kt app/src/accountUriTest/java/com/dot/gallery/cloud/CloudTransferPolicyTest.kt
          cp app/src/test/java/com/dot/gallery/cloud/CloudRequestSnapshotTest.kt app/src/accountUriTest/java/com/dot/gallery/cloud/CloudRequestSnapshotTest.kt
      - name: Test cloud account URI isolation
        run: ./gradlew :app:testUniversalNoMLDebugUnitTest -PgoreecloudUriOnlyTests=true --tests com.dot.gallery.cloud.CloudUriTest --tests com.dot.gallery.cloud.CloudTransferPolicyTest --tests com.dot.gallery.cloud.CloudRequestSnapshotTest --no-daemon --console plain
