name: Android offline Kotlin compile
on:
  pull_request:
  push:
    branches: ["ftn/**"]
permissions:
  contents: read
jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"
      - run: sdkmanager --channel=3 --install "platforms;android-37.0" "ndk;29.0.14206865" "cmake;3.31.6"
      - run: ./gradlew :app:compileUniversalNoMLDebugKotlin --no-daemon --console plain
