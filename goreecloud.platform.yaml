  everkeep:
    result: applicable-blocked
    version: null
    evidence:
      - SPECIFICATIONS.md
      - USER-MANUAL.md
    notes: Gallery has local settings and Favorites portability plus Android-authorized Trash and Restore behavior, but accepted Everkeep integration and complete Gallery-owned recovery acceptance are not established.
  glaze_ui:
    result: applicable-migration-required
    version: "1.6.0"
    evidence:
      - native/app/src/main/kotlin/com/goreecloud/gallery/GalleryGlazeContract.kt
      - native/app/src/test/kotlin/com/goreecloud/gallery/GalleryGlazeContractTest.kt
      - native/app/src/main/kotlin/com/goreecloud/gallery/GalleryGlazeSurfaces.kt
      - docs/GLAZE-UI.md
    notes: Current Official Stable GLAZE UI authority is V1.6 / 1.6.0 at exact release source a7180679ea851389e0f3004515f9a25f420e716d. Gallery's implemented native presentation contract still maps V1.4 / 1.4.0 source semantics at ee057ce9e729296aeaeda182d01db89f52bd66f3, so Gallery remains applicable-migration-required. This declaration does not relabel the existing V1.4 implementation as migrated or establish application conformance. Fresh V1.6 source adoption plus whole-application rendered, interaction, accessibility, adaptive/form-factor, representative-device, performance, Human Visual Excellence, rollback, release, and production acceptance remain required.
  mesh:
    result: applicable-blocked
    version: null
    evidence: []
    notes: Local Gallery use does not depend on Mesh, but accepted GoreeCloud Mesh registration, capability publication, and runtime integration are not established.
    capabilities: []
    dependencies: []
    published_events: []
    consumed_events: []
  identity:
    result: applicable-blocked
    version: null
    evidence:
