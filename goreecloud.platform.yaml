schema_version: "0.4"

component:
  type: application
  id: goreecloud-gallery
  product_name: GoreeCloud Gallery
  repository: GoreeCloud/gallery

lifecycle: development
version: "0.7.1-dev"

supported_platforms:
  - android

api:
  versions: []
  endpoints: []

platform_systems:
  manager:
    result: applicable-blocked
    version: null
    evidence:
      - README.md
      - PROJECT-SPECIFICATIONS.md
    notes: Gallery is a first-party GoreeCloud application, but accepted Manager visibility and administrative integration are not established.
  privacy_shield:
    result: applicable-blocked
    version: null
    evidence:
      - PROJECT-SPECIFICATIONS.md
      - native/app/src/main/AndroidManifest.xml
      - native/app/src/main/kotlin/com/goreecloud/gallery/GalleryMediaAccessPolicy.kt
    notes: The first-party native app keeps local media reads behind Android authorization and has no INTERNET permission, but accepted Privacy Shield integration and production privacy validation are not established.
  wardveil_security:
    result: applicable-blocked
    version: null
    evidence:
      - SECURITY.md
      - PROJECT-SPECIFICATIONS.md
      - native/app/src/main/AndroidManifest.xml
    notes: Gallery has Android sandbox and permission boundaries plus repository security controls, but accepted Wardveil Security integration and production security validation are not established.
  everkeep:
    result: applicable-blocked
    version: null
    evidence:
      - PROJECT-SPECIFICATIONS.md
      - USER-MANUAL.md
      - native/app/src/main/AndroidManifest.xml
    notes: Gallery is offline-first and Android backup is disabled in the current native app; accepted Everkeep backup, recovery, and continuity integration are not established.
  glaze_ui:
    result: applicable-migration-required
    version: "1.6.0"
    evidence:
      - native/app/src/main/kotlin/com/goreecloud/gallery/GalleryGlazeContract.kt
      - native/app/src/test/kotlin/com/goreecloud/gallery/GalleryGlazeContractTest.kt
      - docs/GLAZE-UI.md
      - README.md
      - PROJECT-SPECIFICATIONS.md
    notes: Current Official Stable authority is GLAZE UI V1.6 / 1.6.0 at accepted release source a7180679ea851389e0f3004515f9a25f420e716d. The current candidate pins that exact source, qualification anchor, Stable runtime entrypoint, and presentation-only authority boundary in the first-party native Gallery contract. Whole-application rendered, interaction, accessibility, adaptive/form-factor, representative-device, performance, Human Visual Excellence, rollback, release, and production acceptance remain incomplete, so Gallery remains applicable-migration-required.
  mesh:
    result: applicable-blocked
    version: null
    evidence: []
    notes: Device-local Gallery use does not require Mesh, but accepted GoreeCloud Mesh registration, capability publication, dependency/event contracts, and runtime integration are not established.
    capabilities: []
    dependencies: []
    published_events: []
    consumed_events: []
  identity:
    result: applicable-blocked
    version: null
    evidence:
      - README.md
      - PROJECT-SPECIFICATIONS.md
    notes: Device-local browsing does not require a GoreeCloud account, but accepted Identity integration for any future account, Photos, device, or delegated-authority behavior is not established.
  policy:
    result: applicable-blocked
    version: null
    evidence:
      - README.md
      - PROJECT-SPECIFICATIONS.md
      - goreecloud.platform.yaml
    notes: GoreeCloud Policy is applicable to Gallery policy representation and media-operation constraints, but no accepted runtime Policy evaluation, enforcement coordination, explanation, freshness, exception, or production acceptance exists.
  observability:
    result: applicable-blocked
    version: null
    evidence:
      - README.md
      - PROJECT-SPECIFICATIONS.md
      - goreecloud.platform.yaml
    notes: Gallery has CI and local Development behavior, but accepted GoreeCloud Observability health, metrics, diagnostics, performance, dependency-health, provenance/freshness, alerting, collection-gap, and representative-device runtime acceptance are not established.

health:
  health_endpoint: null
  readiness_endpoint: null

continuity:
  backup:
    required: true
    requirements:
      - Define approved Gallery-owned durable-state backup scope without treating Android-owned photos and videos as Gallery backup data.
      - Preserve Android user/profile isolation and exclude unapproved sensitive state.
  restore:
    required: true
    requirements:
      - Validate Gallery-owned restored preferences and collections before applying them.
      - Keep Android MediaStore authoritative for device media state.
  export:
    required: true
    requirements:
      - Keep user-initiated Gallery-owned export explicit and bounded.
      - Do not silently export device media, credentials, or unrelated provider metadata.
  portability:
    required: true
    requirements:
      - Keep Gallery-owned portability explicit, versioned, documented, and separately reviewed from Android-owned media storage.

external_dependencies:
  - name: Android platform
    purpose: Application lifecycle, MediaStore access, media permissions, accessibility, and device execution environment.
    required: true
    version_constraint: ">=29"

compatibility:
  platform_contract: "0.4"
  glaze_ui_required: "1.6.0"
  requires:
    - goreecloud-platform-contract==0.4
    - glaze-ui==1.6.0
    - android-api>=29
  provides: []

evidence:
  acceptance_tests: []
  release: []

conformance:
  status: nonconformant
  validated_at: null
  evidence:
    - README.md
    - PROJECT-SPECIFICATIONS.md
    - SECURITY.md
    - USER-MANUAL.md
    - FEATURES.md
    - FEATURE-ROADMAP.md
    - native/app/build.gradle.kts
    - native/app/src/main/AndroidManifest.xml
    - native/app/src/main/kotlin/com/goreecloud/gallery/GalleryGlazeContract.kt
    - native/app/src/test/kotlin/com/goreecloud/gallery/GalleryGlazeContractTest.kt
    - native/app/src/main/kotlin/com/goreecloud/gallery/GalleryMediaAccessPolicy.kt
    - docs/GLAZE-UI.md
  blockers:
    - "Gallery has a bounded GLAZE UI V1.6 / 1.6.0 native authority baseline, but complete downstream consumer migration and whole-application rendered, interaction, accessibility, adaptive/form-factor, representative-device, performance, Human Visual Excellence, rollback, release, and production acceptance remain incomplete."
    - "Privacy Shield integration and acceptance are not established."
    - "Wardveil Security integration and acceptance are not established."
    - "Everkeep integration and complete Gallery-owned backup and recovery acceptance are not established."
    - "GoreeCloud Identity integration is not established for any future identity-aware or Photos-backed capability."
    - "GoreeCloud Mesh registration, capability publication, dependency/event contracts, and runtime acceptance are not established."
    - "Manager platform visibility and administrative integration acceptance are not established."
    - "GoreeCloud Policy runtime evaluation, enforcement coordination, explanation, freshness, exception, and evidence integration are not established."
    - "GoreeCloud Observability health, metrics, diagnostics, performance, dependency-health, provenance/freshness, alerting, collection-gap, and representative-device runtime acceptance are not established."
    - "Representative physical-device/OEM/profile accessibility, media-permission, orientation, destructive-operation, performance, and recovery acceptance remain incomplete."
    - "Production signing, distribution, release approval, Release Candidate qualification, and Stable qualification remain outstanding."
