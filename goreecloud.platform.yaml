health:
  health_endpoint: null
  readiness_endpoint: null

continuity:
  backup:
    required: true
    requirements:
      - Define the approved Gallery-owned durable-state backup scope without treating Android-owned photo and video content as Gallery backup data.
      - Preserve user/profile isolation and exclude unapproved hidden, protected, credential, and sensitive metadata from backup scope.
  restore:
    required: true
    requirements:
      - Validate Gallery-owned restored preferences and collections before applying them.
      - Keep Android MediaStore authoritative for device media and Trash state.
  export:
    required: true
    requirements:
      - Keep user-initiated Gallery settings and Favorites export bounded to Gallery-owned state.
      - Do not silently export device media, protected content, credentials, or unrelated provider metadata.
  portability:
    required: true
    requirements:
      - Keep Gallery-owned portability explicit, versioned, documented, and separately reviewed from Android-owned media storage.

external_dependencies:
  - name: Android platform
    purpose: Application lifecycle, MediaStore access and mutation/write authorization, media permissions, Storage Access Framework where used, accessibility, and device execution environment.
    required: true
    version_constraint: ">=29"

compatibility:
  platform_contract: "0.3"
  glaze_ui_required: "1.3.0"
  requires:
    - goreecloud-platform-contract==0.3
    - glaze-ui==1.3.0
    - android-api>=29
  provides: []

evidence:
  acceptance_tests: []
  release: []

conformance:
  status: nonconformant
  validated_at: null
  evidence:
    - README.md
    - SPECIFICATIONS.md
    - SECURITY.md
    - USER-MANUAL.md
    - FEATURES.md
    - FEATURE-ROADMAP.md
    - native/app/src/main/AndroidManifest.xml
    - native/app/src/main/kotlin/com/goreecloud/gallery/GalleryGlazeContract.kt
    - native/app/src/main/kotlin/com/goreecloud/gallery/GalleryGlazeSurfaces.kt
    - native/app/src/test/kotlin/com/goreecloud/gallery/GalleryGlazeContractTest.kt
    - native/app/src/main/kotlin/com/goreecloud/gallery/GalleryMediaAccessPolicy.kt
    - native/app/src/main/kotlin/com/goreecloud/gallery/GalleryPhotoEditPolicy.kt
    - native/app/src/main/kotlin/com/goreecloud/gallery/GalleryEditedMediaStore.kt
    - native/core/src/main/kotlin/com/goreecloud/gallery/core/GalleryNewFolderMovePolicy.kt
    - docs/GLAZE-UI.md
    - docs/development/media-move.md
  blockers:
    - GLAZE UI V1.3 / 1.3.0 repository-local source mapping and a bounded native Adaptive Resonance chrome pass exist at exact Glaze authority ff34f232f295c9dcb07e4c681f66d4104d0b9323, but fresh whole-application rendered, interaction, accessibility, adaptive/form-factor, representative-device, performance, Human Visual Excellence, fallback, rollback, release, and production acceptance remain incomplete.
    - Android-authorized existing-folder Move and same-source New Folder Move are Development candidates; representative-device cancellation, photo/video/mixed selection, new-folder naming/collision behavior, permission/scope change, Activity recreation, refresh, OEM/profile, accessibility, and provider-failure acceptance remains incomplete. Copy remains separately gated.
    - The pinned Platform Contract 0.3 evaluator still encodes a 1.4.0 compatibility constant while the canonical Glaze UI repository's published Stable release is V1.3.0; Gallery remains Development/nonconformant and does not use that stale evaluator constant to make a Stable Glaze claim.
    - Privacy Shield integration and acceptance are not established.
    - Wardveil Security integration and acceptance are not established.
    - Everkeep integration and complete Gallery-owned backup and recovery acceptance are not established.
    - GoreeCloud Identity integration is not established for any future identity-aware or Photos-backed capability.
    - GoreeCloud Mesh registration, capability publication, and runtime acceptance are not established.
    - GoreeCloud Sync integration and acceptance are not established for any future cross-device Gallery-owned state or Photos continuity behavior.
    - Manager platform visibility and administrative integration acceptance are not established.
    - Representative physical-device/OEM/profile photo-editor, accessibility, orientation, media-permission, and destructive-operation edge-case acceptance remains incomplete.
    - Production signing, distribution, release approval, Release Candidate qualification, and Stable qualification remain outstanding.
