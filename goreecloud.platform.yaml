      - native/app/src/test/kotlin/com/goreecloud/gallery/GalleryGlazeContractTest.kt
      - native/app/src/main/kotlin/com/goreecloud/gallery/GalleryGlazeSurfaces.kt
      - docs/GLAZE-UI.md
    notes: Gallery's Development source maps its native contract to the currently published Stable GLAZE UI V1.3 / 1.3.0 Adaptive Resonance release at exact authority ff34f232f295c9dcb07e4c681f66d4104d0b9323 and applies a bounded native Adaptive Resonance material/chrome mapping. This source mapping does not establish application conformance. Gallery remains migration-required until fresh whole-application rendered, interaction, accessibility, adaptive/form-factor, representative-device, performance, Human Visual Excellence, fallback, rollback, release, and production acceptance is completed. V1.4/V1.4.1 design material remains Proposed and is not represented as current Stable authority.
  mesh:
    result: applicable-blocked
    version: null
    evidence: []
    notes: Local Gallery use does not depend on Mesh, but accepted GoreeCloud Mesh registration, capability publication, and runtime integration are not established.
    capabilities: []
    dependencies: []
    published_events: []
    consumed_events: []
  identity:
    result: applicable-blocked
    version: null
    evidence:
      - SPECIFICATIONS.md
